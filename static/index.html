<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reversa</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#131a26;--mute:#5c6675;--line:#dde1e7;--accent:#0b6b5d;--accent-bg:#e3f2ef;
    --free:#1f8a4c;--held:#2f6fd0;--committed:#131a26;--refund_pending:#c77700;--fees:#c0392b;--warn-bg:#fff4dc;--bad-bg:#fdeceb;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;gap:14px;align-items:baseline;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;letter-spacing:-.01em} header span{color:var(--mute)} .sp{flex:1}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px 20px;align-items:start}
  @media(max-width:1050px){main{grid-template-columns:1fr}}
  h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:#aeb6c2} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  #log{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
  .msg{max-width:92%;padding:7px 11px;border-radius:10px;overflow-wrap:anywhere}
  .you{align-self:flex-end;background:var(--ink);color:#fff} .bot{align-self:flex-start;background:var(--accent-bg)}
  .bot.bad{background:var(--bad-bg)} .hint{color:var(--mute);font-style:italic}
  .inrow{display:flex;gap:8px;margin-top:10px} .inrow input{flex:1;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px}
  #mic.on{background:var(--fees);border-color:var(--fees);color:#fff}
  .turns button{display:block;width:100%;text-align:left;margin-bottom:6px} .turns small{color:var(--mute);display:block;font-size:11.5px}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpis{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end} .kpis div small{display:block;color:var(--mute);font-size:12px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .step{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px}
  .step b{font-variant-numeric:tabular-nums} .step.now{border-color:var(--ink)}
  .pending{background:var(--warn-bg);border-color:#ecd9a8} .pending code{font-size:15px;font-weight:700;font-family:var(--mono)}
  .item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .item:last-child{border-bottom:0}
  .item > div{min-width:0} .item small{color:var(--mute);display:block} .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:600;border:1px solid currentColor}
  .p-held{color:var(--held)} .p-committed{color:var(--committed)}
  .bar{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin:4px 0 10px;background:var(--line)}
  .bar i{display:block;min-width:0}
  table{width:100%;border-collapse:collapse} td{padding:4px 0;border-bottom:1px solid var(--line)} td.r{font-family:var(--mono)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
  .ok{color:var(--free);font-weight:700} .no{color:var(--fees);font-weight:700}
  .ev{font-family:var(--mono);font-size:12px;padding:3px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere} .ev:last-child{border:0}
  #events{max-height:230px;overflow-y:auto} .empty{color:var(--mute);font-style:italic}
  .ctl{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>Reversa</h1><span>Book at the speed of speech. Undo at the price of truth.</span><span class="sp"></span>
  <label style="color:var(--mute)"><input type="checkbox" id="tts" checked> Speak replies</label>
  <button onclick="ctl('/api/demo/reset').then(()=>{$('log').innerHTML='';greet()})">Reset</button></header>
<main>
  <section>
    <h2>Conversation</h2>
    <div class="card">
      <div id="log" aria-live="polite"></div>
      <div class="inrow">
        <button id="mic" onclick="toggleMic()" title="Speak (Chrome / Edge)">🎙 Speak</button>
        <input id="txt" placeholder="…or type what you would say" aria-label="Type what you would say" onkeydown="if(event.key==='Enter')send()">
        <button class="primary" onclick="send()">Send</button>
      </div>
    </div>
    <h2>The five demo turns</h2>
    <div class="card turns">
      <button onclick="say('Goa, 3 nights, ₹40,000, two people')">1 · “Goa, 3 nights, ₹40,000, two people.”<small>holds flight + hotel + activity, exposure ₹0</small></button>
      <button onclick="say('Book it')">2 · “Book it.”<small>read-back, then say the confirm phrase</small></button>
      <button onclick="say('Actually hills, not beach')">3 · “Actually hills, not beach.”<small>CP-SAT finds the cheapest switch</small></button>
      <button onclick="say('Cancel the activity')">4 · “Cancel the activity.”<small>refund goes to pending, not free cash</small></button>
      <button onclick="say('Reconcile')">5 · “Reconcile.”<small>replays the event log</small></button>
    </div>
  </section>

  <section>
    <h2>Trip</h2>
    <div class="card" id="trip"></div>
    <div id="pending"></div>
    <h2>Bookings</h2>
    <div class="card" id="items"></div>
    <h2>Demo controls (the outside world)</h2>
    <div class="card ctl">
      <button onclick="ctl('/api/demo/advance',{hours:72})">Clock +3 days</button>
      <button onclick="ctl('/api/demo/advance',{hours:24})">Clock +1 day</button>
      <button onclick="ctl('/api/demo/settle')">Bank settles refunds</button>
      <button onclick="failNext()">Make next flight commit time out</button>
    </div>
  </section>

  <section>
    <h2>Zero-sum ledger — five states</h2>
    <div class="card" id="ledger"></div>
    <h2>Reconcile</h2>
    <div class="card" id="recon"></div>
    <h2>Event log (append-only)</h2>
    <div class="card" id="events"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = p => (p < 0 ? '−' : '') + '₹' + Math.floor(Math.abs(p) / 100).toLocaleString('en-IN') + (Math.abs(p) % 100 ? '.' + String(Math.abs(p) % 100).padStart(2, '0') : '');
const LABEL = {free: 'Free cash', held: 'Held (no charge yet)', committed: 'Committed', refund_pending: 'Refund pending (not spendable)', fees: 'Fees paid (sunk)'};
const DEST = {goa: 'Goa', manali: 'Manali'};
let state = null;

function bubble(cls, text){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('log').appendChild(d); $('log').scrollTop = 1e9; }
function speak(text){ if (!$('tts').checked || !window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/₹/g, 'rupees ')); u.lang = 'en-IN'; speechSynthesis.speak(u); }
function greet(){ bubble('bot hint', 'Tap a demo turn, type, or press Speak. Try: “Goa, 3 nights, ₹40,000, two people.”'); }

async function api(url, body){ const r = await fetch(url, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); return r.json(); }
async function say(text){
  if (!text.trim()) return;
  bubble('you', text);
  const r = await api('/api/say', {text});
  bubble('bot' + (r.ok ? '' : ' bad'), r.say); speak(r.say); render(r.state);
}
function send(){ const t = $('txt').value; $('txt').value = ''; say(t); }
async function ctl(url, body){ const s = await api(url, body || {}); if (s.balances) render(s); else refresh(); }
async function failNext(){
  const f = (state?.items || []).find(i => i.cat === 'flight' && i.status === 'held');
  const id = f ? f.id : (state?.trip?.dest === 'goa' ? 'fl_man_himal' : 'fl_goa_malabar');
  await api('/api/demo/fail_next', {item_id: id}); bubble('bot hint', 'Armed: the next commit of ' + id + ' will time out, to show the reverse saga.');
}
async function refresh(){ render(await api('/api/state')); }

function render(s){
  state = s;
  const days = Math.floor(s.hours_left / 24), hrs = Math.round(s.hours_left % 24);
  if (!s.trip){ $('trip').innerHTML = '<span class="empty">No trip yet.</span>'; }
  else {
    const steps = s.forecast.map((f, i) => `<span class="step ${i ? '' : 'now'}">${i ? 'inside ' + f.hours_left + 'h' : 'now'}: <b>${rs(f.exposure)}</b></span>`).join('');
    $('trip').innerHTML = `<div class="kpis"><div><small>Exposure — lost if you cancel everything now</small><span class="big">${rs(s.exposure)}</span></div>
      <div><small>Destination</small><b>${esc(DEST[s.trip.dest])}</b> · ${s.trip.nights} nights · ${s.trip.people} people</div>
      <div><small>Departs in</small><b>${days}d ${hrs}h</b></div></div>
      ${s.forecast.length > 1 ? `<div class="steps" title="E(t): exposure as departure approaches">${steps}</div>` : ''}`;
  }
  $('pending').innerHTML = s.pending ? `<div class="card pending"><b>Waiting for spoken confirmation</b> — ${esc(s.pending.kind)} for ${rs(s.pending.amount)}.<br>Say or type: <code>${esc(s.pending.phrase)}</code> <button style="margin-left:8px" onclick="say('${esc(s.pending.phrase)}')">Say it</button> <button onclick="say('confirm ${Math.floor(s.pending.amount / 100) + 2700}')">Say a wrong number</button></div>` : '';
  $('items').innerHTML = s.items.length ? s.items.map(i => `<div class="item"><div><b>${esc(i.name)}</b> <span class="pill p-${i.status}">${i.status}</span><small>${esc(i.cat)} · cancel curve: ${i.curve.map(c => `≥${c[0]}h ${c[1] / 100}%`).join(' → ')}</small></div>
    <div class="r"><b>${rs(i.price)}</b><small>${i.status === 'held' ? 'undo costs ₹0' : 'undo costs ' + rs(i.fee_now) + ' (' + i.fee_pct + '%)'}</small></div></div>`).join('') : '<span class="empty">Nothing held or booked.</span>';
  const b = s.balances, total = Object.values(b).reduce((a, v) => a + v, 0);
  $('ledger').innerHTML = (total ? `<div class="bar">${Object.keys(LABEL).filter(k => b[k] > 0).map(k => `<i style="flex:${b[k]};background:var(--${k})" title="${LABEL[k]}: ${rs(b[k])}"></i>`).join('')}</div>` : '') +
    `<table>${Object.keys(LABEL).map(k => `<tr><td><span class="dot" style="background:var(--${k})"></span>${LABEL[k]}</td><td class="r">${rs(b[k])}</td></tr>`).join('')}
    <tr><td><b>Total = budget</b></td><td class="r"><b>${rs(total)}</b></td></tr></table>`;
  const rc = s.reconcile;
  $('recon').innerHTML = `<div style="margin-bottom:6px"><span class="${rc.ok ? 'ok' : 'no'}">${rc.ok ? '✓ reconcile() == ₹0' : '✗ books do not balance'}</span></div>` +
    rc.checks.map(c => `<div><span class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✗'}</span> ${esc(c.name)}</div>`).join('');
  $('events').innerHTML = s.events.length ? s.events.slice().reverse().map(e => `<div class="ev">#${e.id} <b>${esc(e.type)}</b> ${esc(e.payload.name || e.payload.item?.name || '')} ${Object.entries(e.postings).map(([k, v]) => `${esc(k)} ${v > 0 ? '+' : '−'}${rs(Math.abs(v)).slice(1)}`).join(', ')}</div>`).join('') : '<span class="empty">No events.</span>';
}

// Browser speech-to-text (Chrome / Edge). Typing always works as a fallback.
let rec = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ bubble('bot bad', 'This browser has no speech recognition. Use Chrome or Edge, or type instead.'); return; }
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false;
  rec.onresult = e => say(e.results[0][0].transcript);
  rec.onerror = e => bubble('bot bad', 'Microphone error: ' + e.error);
  rec.onend = () => { rec = null; $('mic').classList.remove('on'); $('mic').textContent = '🎙 Speak'; };
  speechSynthesis && speechSynthesis.cancel(); rec.start(); $('mic').classList.add('on'); $('mic').textContent = '■ Listening…';
}
greet(); refresh();
</script>
</body>
</html>
